plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.parcelize'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

Properties properties = new Properties()
properties.load(project.rootProject.file('local.properties').newDataInputStream())

Properties apiProperties = new Properties()
apiProperties.putAll(properties)

android {
    namespace 'com.lgcns.codeengine'
    compileSdk 34
    ndkVersion '25.1.8937393'

    defaultConfig {
        applicationId "com.lgcns.codeengine"
        minSdk 24 // Android 7
        targetSdk 34 // Android 14
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField("String", "BUILD_DATE", "\"${new Date().format('yyyy.MM.dd')}\"")
        
        // Load API Key from local.properties
        File localPropertiesFile = project.rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            apiProperties.load(localPropertiesFile.newDataInputStream())
        }
        buildConfigField("String", "GEMINI_API_KEY", "\"${apiProperties.getProperty("GEMINI_API_KEY", "")}\"")

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            storeFile file('../release.keystore.jks')
            storePassword apiProperties.getProperty("KEYSTORE_PASSWORD", "")
            keyAlias 'androiddebugkey'
            keyPassword apiProperties.getProperty("KEY_PASSWORD", "")
        }
    }

    // SERVER_TYPE: PROD, DEV, TEST
    buildTypes {
        debug {
            buildConfigField 'String', 'BASE_URL', '"https://localhost:5174/"'
            buildConfigField 'String', 'REMOTE_TEST_URL', '"https://5e510330f2c0d300147c034c.mockapi.io/"'
            buildConfigField 'String', 'WEBVIEW_PLUGIN_TEST', '"file:///android_asset/plugin/plugin.html"'
            //buildConfigField 'String', 'TMAP_APP_KEY', properties["tMapAppKey"]
	        buildConfigField 'String', 'TMAP_APP_KEY', "\"${apiProperties.getProperty("tMapAppKey", "")}\""
            buildConfigField 'String', 'SERVER_TYPE', '"DEV"'

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            buildConfigField 'String', 'BASE_URL', '"http://192.168.0.10:8080/api/"'
            buildConfigField 'String', 'REMOTE_TEST_URL', '"https://5e510330f2c0d300147c034c.mockapi.io/"'
            buildConfigField 'String', 'WEBVIEW_PLUGIN_TEST', '"file:///android_asset/plugin/plugin.html"'
            //buildConfigField 'String', 'TMAP_APP_KEY', properties["tMapAppKey"]
	        buildConfigField 'String', 'TMAP_APP_KEY', "\"${apiProperties.getProperty("tMapAppKey", "")}\""
            buildConfigField 'String', 'SERVER_TYPE', '"PROD"'

            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
    dataBinding {
        enabled = true
    }
    buildFeatures {
        compose = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.8"
    }
    externalNativeBuild {
        ndkBuild {
            path 'Android.mk'
        }
    }
}

dependencies {

    // App dependencies
    implementation "androidx.annotation:annotation:1.7.1"
    implementation "com.jakewharton.timber:timber:5.0.1"
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    ksp "androidx.room:room-compiler:2.6.1"

    // Architecture Components
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"

    // androidX
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // custom splash screen
    implementation "androidx.core:core-splashscreen:1.0.1"

    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.2"
    implementation "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:0.8.0"

    // Hilt
    implementation "com.google.dagger:hilt-android:2.48.1"
    kapt "com.google.dagger:hilt-compiler:2.48.1"

    // Kotlin
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.4.1"

    // Themes
    implementation 'com.google.android.material:material:1.11.0'

    // glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    // 암복호화
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.67'

    // Firebase Push Message
    implementation "com.google.firebase:firebase-messaging-ktx:23.4.1"

    // Firebase Analytics
    implementation platform('com.google.firebase:firebase-bom:31.2.3')
    implementation 'com.google.firebase:firebase-analytics-ktx'

    // Firebase dynamiclinks
    implementation 'com.google.firebase:firebase-dynamic-links-ktx:21.2.0'

    // apng 파일 read
    implementation 'com.linecorp:apng:1.11.0'

    // Video Compression
    implementation 'com.github.AbedElazizShe:LightCompressor:1.3.2'

    // create barcode
    implementation 'com.google.zxing:core:3.4.1'

    // camera
    implementation "androidx.camera:camera-lifecycle:1.3.1"

    // open source for the image crop
    implementation "com.vanniktech:android-image-cropper:4.5.0"

    // 지문인식 등
    implementation 'androidx.biometric:biometric:1.1.0'

    // TMap API for POI
    implementation files('libs/com.skt.Tmap_1.75.jar')

    // Barcode Detect and Scan
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    implementation 'com.google.guava:guava:27.1-android'

    // Location
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.0.2'

    // 광고 ID
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'

    // Lottie
    implementation "com.airbnb.android:lottie:6.1.0"

    // 카카오 미설치시 이동
    implementation "com.kakao.sdk:v2-all:2.17.0"

    // crashlytics
    implementation(platform("com.google.firebase:firebase-bom:32.7.0"))
    implementation("com.google.firebase:firebase-crashlytics")
    implementation("com.google.firebase:firebase-analytics")

    // Goggle GMS for current location
    implementation "com.google.android.gms:play-services-location:21.1.0"

    // Compose
    def composeBom = platform("androidx.compose:compose-bom:2024.02.00")
    implementation composeBom
    androidTestImplementation composeBom
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.7.0"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // Instrumented UI tests (Compose)
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
