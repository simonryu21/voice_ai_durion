[project]
name = "pipecat-mobile"
version = "0.1.0"
description = "Mobile bot example for building voice AI bots with Pipecat"
requires-python = ">=3.10"
dependencies = [
    "pipecat-ai[webrtc,daily,silero,deepgram,openai,cartesia,google,runner,mem0]",
    "pipecat-ai-cli",
    "duckduckgo-search>=6.0.0",
    "tavily-python>=0.3.0",
    "authlib>=1.3.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "google-play-scraper>=1.2.0",
    "pyyaml>=6.0",
    "langfuse>=3.0,<4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Source pipecat-ai from the parent workspace so the mobile test venv
# picks up the in-tree fork (custom WebRTC/RTVI/auth changes that aren't
# in the published pypi package).
[tool.uv.sources]
pipecat-ai = { path = "..", editable = true }
# Local fork of mem0ai with OSS server compatibility patches.
mem0ai = { path = "../../mobile_mem0", editable = true }

